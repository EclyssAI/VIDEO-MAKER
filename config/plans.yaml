# Limites por plano do ClipeiAki (fonte única: backend, conta e landing leem daqui).
# minutes_per_month = minutos de vídeo ENVIADOS (upload) no mês corrente.
# live_slots = transmissões conectadas/monitoradas AO MESMO TEMPO (aplicado no backend, por conta).
# live_hours_per_month / live_clips_per_month / live_ai_usd_per_month = franquias do Live Monitor. STATUS: PROPOSTA calculada a partir dos testes
#   de carga (docs/CAPACIDADE_E_CUSTOS.md) — aguardando aprovação comercial antes da venda pública.
plans:
  beta:            # acesso de demonstração (sem assinatura) — habilitado por BETA_SIGNUP=1
    label: "Beta"
    price_brl: 0
    projects_per_month: 3
    minutes_per_month: 30
    max_upload_mb: 500
    max_video_minutes: 15
    clips_per_project: 3
    premium_assets: false
    live_max_minutes: 30         # Claude Live Monitor: duração máxima por sessão
    live_budget_usd_max: 0.50    # teto do orçamento de IA por sessão
    live_max_calls: 30
    live_slots: 1
    live_hours_per_month: 2
    live_clips_per_month: 10
    live_ai_usd_per_month: 0.50   # PROPOSTA: teto de gasto com a API do Claude no mês
  creator:
