    max_video_minutes: 90
    clips_per_project: 6
    premium_assets: false
    live_max_minutes: 120
    live_budget_usd_max: 2.00
    live_max_calls: 120
    live_slots: 3
    live_hours_per_month: 60
    live_clips_per_month: 150
